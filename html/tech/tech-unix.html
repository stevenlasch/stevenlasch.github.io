CHMOD -- Read/Write/Execute
- sudo chmod 777 /Library/Server/Web/Data/Sites/Default
- or recursively: sudo chmod -R 0777 /Library/Server/Web/Data/Sites/Default

Paths
- On the mac, your paths file is located in your /etc folder
- run this command: sudo pico /etc/paths

Delete mail
- server:~ $ mail
- ? delete 1-50
- ? q

Manual pages
- server:~ $ man mail
- : q

Copy the contents of a text file to the pasteboard
- cat file | pbcopy

Find the php.ini file
- locate php.ini
- sudo pico /private/etc/php.ini
